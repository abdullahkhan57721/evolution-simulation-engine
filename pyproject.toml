[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-simulation-engine"
version = "0.1.0"
description = """An extensible engine for spatial ecological and evolutionary simulations."""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "complexipy>=5.2,<6",
    "import-linter>=2.0",
    "pytest-cov>=5.0",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"

[tool.complexipy]
paths = ["src/evo_engine"]
max-complexity-allowed = 15
check-script = false
exclude = []
