[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-simulation-engine"
version = "0.1.0"
description = """A domain-neutral evolutionary simulation engine with compositional biology, spatial ecology, reproducible experiments, and portfolio visualization."""
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Abdullah Khan" },
]
keywords = [
    "evolution",
    "genetics",
    "simulation",
    "spatial-ecology",
    "reproducible-research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "attrs>=25.0",
]

[project.urls]
Documentation = "https://abdullahkhan57721.github.io/evolution-simulation-engine/"
Repository = "https://github.com/abdullahkhan57721/evolution-simulation-engine"
Issues = "https://github.com/abdullahkhan57721/evolution-simulation-engine/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "complexipy>=5.2,<8",
    "import-linter>=2.0",
    "pytest-cov>=5.0",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"

[tool.complexipy]
paths = ["src/evo_engine"]
max-complexity-allowed = 15
check-script = false
exclude = []

[tool.importlinter]
root_package = "evo_engine"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "validation-foundation"
name = "Validation is a dependency foundation"
type = "forbidden"
source_modules = ["evo_engine.validation"]
forbidden_modules = [
    "evo_engine.access",
    "evo_engine.admission",
    "evo_engine.behavior",
    "evo_engine.biology",
    "evo_engine.departure",
    "evo_engine.development",
    "evo_engine.energetics",
    "evo_engine.engine",
