[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evolution-simulation-engine"
version = "0.1.0"
description = """An extensible engine for spatial ecological and evolutionary simulations."""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "pyright>=1.1",
    "complexipy>=5.2,<8",
    "import-linter>=2.0",
    "pytest-cov>=5.0",
]

docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = "venv"

[tool.complexipy]
paths = ["src/evo_engine"]
max-complexity-allowed = 15
check-script = false
exclude = []

[tool.importlinter]
root_package = "evo_engine"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "validation-foundation"
name = "Validation is a dependency foundation"
type = "forbidden"
source_modules = ["evo_engine.validation"]
forbidden_modules = [
    "evo_engine.behavior",
    "evo_engine.development",
    "evo_engine.energetics",
    "evo_engine.engine",
    "evo_engine.genetics",
    "evo_engine.growth",
    "evo_engine.life_history",
    "evo_engine.processes",
    "evo_engine.reproduction",
    "evo_engine.resolvers",
    "evo_engine.spatial",
    "evo_engine.world",
]

[[tool.importlinter.contracts]]
id = "genetics-upstream"
name = "Genetics stays independent of downstream simulation domains"
type = "forbidden"
source_modules = ["evo_engine.genetics"]
forbidden_modules = [
    "evo_engine.behavior",
    "evo_engine.development",
    "evo_engine.energetics",
    "evo_engine.engine",
    "evo_engine.growth",
    "evo_engine.life_history",
    "evo_engine.processes",
    "evo_engine.reproduction",
    "evo_engine.resolvers",
    "evo_engine.spatial",
    "evo_engine.world",
]

[[tool.importlinter.contracts]]
id = "domains-do-not-orchestrate"
name = "Domain packages do not depend on processes or resolvers"
type = "forbidden"
source_modules = [
    "evo_engine.behavior",
    "evo_engine.development",
    "evo_engine.energetics",
    "evo_engine.genetics",
    "evo_engine.growth",
    "evo_engine.life_history",
    "evo_engine.reproduction",
    "evo_engine.spatial",
    "evo_engine.world",
]
forbidden_modules = [
    "evo_engine.processes",
    "evo_engine.resolvers",
]

[[tool.importlinter.contracts]]
id = "engine-does-not-select-concrete-behavior"
name = "Engine orchestration does not depend on concrete processes or resolvers"
type = "forbidden"
source_modules = ["evo_engine.engine"]
forbidden_modules = [
    "evo_engine.processes",
    "evo_engine.resolvers",
]
