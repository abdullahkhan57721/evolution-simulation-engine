site_name: Evolution Simulation Engine

theme:
  name: material

nav:
  - Home: index.md
  - Model Notes: model_notes.md
  - Energy Expenditure: energy_expenditure.md
  - Feeding Physiology: feeding.md
  - Heritable Physiological Performance: physiological_performance.md
  - Explicit Physiological Tradeoffs: physiological_tradeoffs.md
  - Ecological Performance: ecological_performance.md
  - Spatial Environmental Fields: environmental_fields.md
  - Movement Motivation and Targeting: movement_motivation.md
  - Mate Choice and Sexual Selection: sexual_selection.md
  - Mating Types and Reproductive Identity: mating_types.md
  - Life-History Energy Strategy: life_history_energy_strategy.md
  - Lifecycle and Age Mortality: lifecycle.md
  - Evolution Observability: observability.md
  - Event Telemetry and Causal History: event_telemetry.md
  - Pedigree and Lifetime Fitness: pedigree_fitness.md
  - Allele and Genotype Frequencies: genetic_composition.md
  - Reproducible Experiments and Export: experiments.md
  - Exact Checkpoint and Resume: checkpointing.md
  - Reference Ecology: reference_ecology.md
  - Development Log: development_log.md
  - API Reference:
      - Validators: references/validators.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            docstring_section_style: list
            members_order: source
            show_root_heading: false
            show_root_full_path: false
            show_source: true
            separate_signature: true
            show_signature_annotations: true
            line_length: 88
