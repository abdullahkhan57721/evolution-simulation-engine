name: Implementation milestone
description: Implement a scoped feature, refactor, hardening task, or other code milestone.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Use this form for implementation-ready work. If the public architecture is still unresolved, use the Architecture/design form first.

        Keep the milestone narrow enough to review as one coherent change. Out-of-scope findings should become linked follow-up Issues instead of silently expanding this ticket.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What concrete outcome should exist when this issue is complete?
      placeholder: Describe the intended end state, not only the first code change.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why is this work useful or necessary now?
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
      description: Which issues, PRs, decisions, or external facts must be resolved first?
      placeholder: Write "None" if there are no known blockers.
    validations:
      required: true

  - type: textarea
    id: allowed_areas
    attributes:
      label: Expected / allowed areas
      description: Which files, packages, subsystems, or public surfaces are expected to change?
      placeholder: |
        - src/evo_engine/<package>/
        - tests/<area>/
        - relevant subsystem documentation

        If a correct implementation must cross this boundary, keep the expansion minimal and record why in the Issue or PR.
    validations:
      required: true

  - type: textarea
    id: do_not_touch
    attributes:
      label: Do not touch
      description: Which nearby files, packages, contracts, or systems should remain unchanged unless this issue is explicitly amended?
      placeholder: |
        - frozen simulation-kernel contracts
        - unrelated public APIs
        - unrelated refactors/dependencies
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Implementation requirements
      description: What behavior, integration, migration, or implementation obligations must the solution satisfy?
      placeholder: List requirements that are more specific than the goal but are not themselves acceptance checks.
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What nearby work is deliberately outside this issue?
      placeholder: List scope boundaries that prevent this milestone from expanding unexpectedly.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Architectural constraints
      description: Which existing contracts, ADRs, dependency rules, or semantics must be preserved?
      placeholder: Link to relevant docs/ADRs/tests when possible.
    validations:
      required: true

  - type: textarea
    id: contracts
    attributes:
      label: Proposed contracts / API
      description: Describe public types, methods, protocols, data flow, or other agreed interfaces if relevant.
      placeholder: Write "No public contract change" when not applicable.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use concrete, verifiable completion criteria.
      placeholder: |
        - [ ] Behavior/API implemented
        - [ ] Edge cases covered
        - [ ] Architecture boundaries preserved
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Automated validation required
      description: Identify targeted tests, documentation, architecture checks, and performance evidence required for this milestone.
      placeholder: Include the full protected quality gate unless there is a documented reason not to.
    validations:
      required: true

  - type: textarea
    id: manual_verification
    attributes:
      label: Manual verification
      description: What short user/contributor-level scenario should be exercised in addition to automated checks?
      placeholder: |
        1. State the exact command/action.
        2. State the expected observable result.
        3. Record the observed result in the PR.

        If no meaningful manual check exists, write "Not applicable" and explain why automated coverage is sufficient.
    validations:
      required: true
