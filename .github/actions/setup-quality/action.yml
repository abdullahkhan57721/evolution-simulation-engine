name: Set up quality environment
description: Create the project venv and install the dependencies needed by a quality job.

inputs:
  docs:
    description: Install documentation dependencies.
    required: false
    default: "false"
  performance:
    description: Install performance-profile dependencies.
    required: false
    default: "false"
  ui:
    description: Install Streamlit/Plotly UI dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-ui.txt
          requirements-performance.txt

    - name: Create virtual environment
      shell: bash
      run: python -m venv venv

    - name: Install project and selected quality tools
      shell: bash
      run: |
        extras="dev"
        if [[ "${{ inputs.docs }}" == "true" ]]; then
          extras="dev,docs"
        fi

        install_args=(-e ".[${extras}]")
        if [[ "${{ inputs.ui }}" == "true" ]]; then
          install_args+=(-r requirements-ui.txt)
        fi
        if [[ "${{ inputs.performance }}" == "true" ]]; then
          install_args+=(-r requirements-performance.txt)
        fi

        # setup-python's bundled pip is already modern enough for this Python
        # 3.12 project. Avoiding a pip self-upgrade and resolving all selected
        # dependencies in one invocation reduces repeated setup work per CI job.
        venv/bin/python -m pip install "${install_args[@]}"
