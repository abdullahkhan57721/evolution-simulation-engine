name: Set up quality environment
description: Create the project venv and install the dependencies needed by a quality job.

inputs:
  docs:
    description: Install documentation dependencies.
    required: false
    default: "false"
  performance:
    description: Install performance-profile dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-performance.txt

    - name: Create virtual environment
      shell: bash
      run: python -m venv venv

    - name: Install project and quality tools
      if: ${{ inputs.docs != 'true' }}
      shell: bash
      run: |
        venv/bin/python -m pip install --upgrade pip
        venv/bin/python -m pip install -e ".[dev]"

    - name: Install project, quality, and documentation tools
      if: ${{ inputs.docs == 'true' }}
      shell: bash
      run: |
        venv/bin/python -m pip install --upgrade pip
        venv/bin/python -m pip install -e ".[dev,docs]"

    - name: Install performance tools
      if: ${{ inputs.performance == 'true' }}
      shell: bash
      run: venv/bin/python -m pip install -r requirements-performance.txt
