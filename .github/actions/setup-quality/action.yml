name: Set up quality environment
description: Create the project venv and install the dependencies needed by a quality job.

inputs:
  docs:
    description: Install documentation dependencies.
    required: false
    default: "false"
  performance:
    description: Install performance-profile dependencies.
    required: false
    default: "false"
  ui:
    description: Install Streamlit/Plotly UI dependencies.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          requirements-ui.txt
          requirements-performance.txt

    - name: Create virtual environment
      shell: bash
      run: python -m venv venv

    - name: Install project and quality tools
      shell: bash
      run: |
        extras="dev"
        if [[ "${{ inputs.docs }}" == "true" ]]; then
          extras="dev,docs"
        fi
        venv/bin/python -m pip install --upgrade pip
        venv/bin/python -m pip install -e ".[${extras}]"

    - name: Install UI tools
      if: ${{ inputs.ui == 'true' }}
      shell: bash
      run: venv/bin/python -m pip install -r requirements-ui.txt

    - name: Install performance tools
      if: ${{ inputs.performance == 'true' }}
      shell: bash
      run: venv/bin/python -m pip install -r requirements-performance.txt
