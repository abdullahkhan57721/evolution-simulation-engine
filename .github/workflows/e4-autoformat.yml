name: E4 Branch Autoformat

on:
  push:
    branches:
      - e4/standing-variation-selection
    paths:
      - "src/evo_engine/experiments/e4_selection.py"
      - "scripts/e4_selection.py"
      - "tests/experiments/test_e4_selection.py"
      - ".github/workflows/e4-autoformat.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e4/standing-variation-selection
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Format E4 files
        run: |
          python -m pip install "ruff==0.16.6"
          ruff format \
            src/evo_engine/experiments/e4_selection.py \
            scripts/e4_selection.py \
            tests/experiments/test_e4_selection.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/evo_engine/experiments/e4_selection.py \
            scripts/e4_selection.py \
            tests/experiments/test_e4_selection.py
          git commit -m "E4: apply Ruff formatting"
          git push origin HEAD:e4/standing-variation-selection
