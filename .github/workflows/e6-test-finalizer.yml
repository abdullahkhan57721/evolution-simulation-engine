name: E6 Test Finalizer

on:
  pull_request:
    paths:
      - "scripts/_e6_finalize_tests.py"
      - "tests/experiments/test_e6_invasion_contracts.py"
      - ".github/workflows/e6-test-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-e6-tests:
    name: Finalize E6 test formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-quality
      - name: Apply E6 test finalizer
        run: |
          venv/bin/python scripts/_e6_finalize_tests.py
          venv/bin/ruff format tests/experiments/test_e6_invasion_contracts.py
          venv/bin/pytest tests/experiments/test_e6_invasion.py tests/experiments/test_e6_invasion_contracts.py
          git diff --check
      - name: Commit finalized E6 tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/experiments/test_e6_invasion_contracts.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize E6 guard coverage"
          git push origin HEAD:e6/rare-lineage-invasion
