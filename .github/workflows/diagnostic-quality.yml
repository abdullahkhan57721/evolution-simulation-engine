name: Diagnostic Quality Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnostic-quality:
    name: Expose first failing quality check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install project and quality tools
        run: |
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e ".[dev,docs]"

      - name: Ruff
        run: ./scripts/lint

      - name: Pyright
        run: ./scripts/typecheck

      - name: Import Linter
        shell: bash
        run: |
          set +e
          ./scripts/architecture
          status=$?
          if [[ $status -eq 3 ]]; then
            echo "Import Linter skipped because no architecture contracts are configured."
            exit 0
          fi
          exit "$status"

      - name: Complexipy
        run: ./scripts/complexity

      - name: pytest + coverage
        env:
          COVERAGE_FAIL_UNDER: "90"
        run: ./scripts/coverage

      - name: MkDocs strict build
        run: ./scripts/docs
