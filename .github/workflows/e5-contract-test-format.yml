name: E5 Contract Test Format

on:
  push:
    branches:
      - e5/drift-weak-selection
    paths:
      - ".github/workflows/e5-contract-test-format.yml"

permissions:
  contents: write

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e5/drift-weak-selection
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Remove stale local
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/experiments/test_e5_drift_contracts.py")
          text = path.read_text()
          stale = '    weak = e5.build_e5_treatment(mode="weak_selection", founder_count=2)\n'
          if stale not in text:
              raise SystemExit("expected stale weak local not found")
          path.write_text(text.replace(stale, "", 1))
          PY
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format and run E5 tests
        run: |
          ruff format tests/experiments/test_e5_drift_contracts.py
          ruff check tests/experiments/test_e5_drift_contracts.py
          pytest -q tests/experiments/test_e5_drift.py tests/experiments/test_e5_drift_contracts.py
      - name: Commit formatted contract tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/experiments/test_e5_drift_contracts.py
          git commit -m "E5: format and validate contract tests"
          git push origin HEAD:e5/drift-weak-selection
