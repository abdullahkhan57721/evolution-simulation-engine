name: E5 Quality Fix 2

on:
  push:
    branches:
      - e5/drift-weak-selection
    paths:
      - ".github/workflows/e5-quality-fix2.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e5/drift-weak-selection
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply bounded E5 quality fixes
        run: python scripts/_e5_quality_fix.py
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate focused E5 changes
        run: |
          ruff format src/evo_engine/experiments/e5_drift.py tests/experiments/test_e5_drift.py
          ruff check src/evo_engine/experiments/e5_drift.py tests/experiments/test_e5_drift.py
          ./scripts/complexity
          pytest -q tests/experiments/test_e5_drift.py
      - name: Commit quality fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evo_engine/experiments/e5_drift.py tests/experiments/test_e5_drift.py
          git commit -m "E5: satisfy lint and complexity gates"
          git push origin HEAD:e5/drift-weak-selection
