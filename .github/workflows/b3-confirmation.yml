name: B3 Confirmation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/evo_engine/**"
      - "!src/evo_engine/ui/**"
      - "!src/evo_engine/workbench/**"
      - "!src/evo_engine/presentation/**"
      - "!src/evo_engine/cinematic/**"
      - "scripts/b3_confirmation.py"
      - ".github/workflows/b3-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm-b3:
    name: Independent B3 confirmation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen unseen-seed confirmation
        run: |
          venv/bin/python scripts/b3_confirmation.py \
            --output outputs/b3-confirmation/b3-confirmation.json
      - name: Upload confirmation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b3-confirmation-${{ github.run_id }}
          path: outputs/b3-confirmation/b3-confirmation.json
          retention-days: 30
          if-no-files-found: warn
