name: E7 Scientific Validation

on:
  pull_request:
    paths:
      - "src/evo_engine/experiments/e7_adaptation.py"
      - "src/evo_engine/experiments/__init__.py"
      - "src/evo_engine/presets/controlled_locomotion/**"
      - "scripts/e7_adaptation.py"
      - "tests/experiments/test_e7_adaptation.py"
      - "tests/presets/controlled_locomotion/test_genetics.py"
      - "docs/e7_mutation_driven_adaptation.md"
      - "docs/development/current_state.md"
      - "docs/development/roadmap.md"
      - "mkdocs.yml"
      - ".github/workflows/e7-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

# Issue #176 freezes the final protocol, disjoint confirmation seeds, and
# numeric convergence criteria before this confirmation job was enabled.
jobs:
  discovery-e7:
    name: E7 bounded discovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen discovery seeds across low, near, and high starts
        run: |
          venv/bin/python scripts/e7_adaptation.py \
            --mode discovery \
            --output outputs/e7-validation/e7-discovery.json
      - name: Upload E7 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e7-discovery-${{ github.run_id }}
          path: outputs/e7-validation/e7-discovery.json
          retention-days: 30
          if-no-files-found: warn

  confirmation-e7:
    name: E7 disjoint confirmation
    needs: discovery-e7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen confirmation seeds and evaluate predeclared criteria
        run: |
          venv/bin/python scripts/e7_adaptation.py \
            --mode confirmation \
            --output outputs/e7-validation/e7-confirmation.json
      - name: Upload E7 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e7-confirmation-${{ github.run_id }}
          path: outputs/e7-validation/e7-confirmation.json
          retention-days: 30
          if-no-files-found: warn
