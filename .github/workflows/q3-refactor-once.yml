name: Q3 one-shot binding refactor

on:
  push:
    branches:
      - q3/native-execution-results
    paths:
      - .github/workflows/q3-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q3/native-execution-results
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused refactor
        run: |
          python scripts/_q3_refactor_once.py
          python -m pip install ruff==0.16.7
          ruff format src/evo_engine/desktop/controllers/application.py tests/ui/test_run_execution.py
      - name: Remove one-shot helpers and commit
        run: |
          rm scripts/_q3_refactor_once.py .github/workflows/q3-refactor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Q3: simplify exact run binding"
          git push origin HEAD:q3/native-execution-results
