name: Cinematic Smoke

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "requirements-animation.txt"
      - "src/evo_engine/cinematic/**"
      - "src/evo_engine/presentation/**"
      - "examples/render_portfolio_animation.py"
      - "examples/render_science_aware_cinematic_smoke.py"
      - "examples/render_b3_flagship_cinematic.py"
      - ".github/workflows/cinematic-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Low-quality Manim renders
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-animation.txt
      - name: Install Manim system build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libcairo2-dev \
            libpango1.0-dev \
            pkg-config
      - name: Install project and optional animation dependency
        shell: bash
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e .
          venv/bin/python -m pip install -r requirements-animation.txt
      - name: Render deterministic generic, science-aware, and B3 director smokes
        shell: bash
        run: |
          venv/bin/python examples/render_portfolio_animation.py \
            --quality low \
            --max-steps 2 \
            --output outputs/cinematic-smoke.mp4
          venv/bin/python examples/render_science_aware_cinematic_smoke.py \
            --quality low \
            --output outputs/science-aware-cinematic-smoke.mp4
          venv/bin/python examples/render_b3_flagship_cinematic.py \
            --excerpt \
            --quality low \
            --output outputs/b3-director-smoke.mp4
          venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          import av

          outputs = (
              Path("outputs/cinematic-smoke.mp4"),
              Path("outputs/science-aware-cinematic-smoke.mp4"),
              Path("outputs/b3-director-smoke.mp4"),
          )
          for output in outputs:
              assert output.is_file(), output
              assert output.stat().st_size > 1_000, output.stat().st_size
              with av.open(str(output)) as container:
                  video_streams = container.streams.video
                  assert video_streams, f"{output} has no video stream."
                  frame = next(container.decode(video_streams[0]))
                  assert frame.width > 0 and frame.height > 0
              print(
                  f"Verified {output} ({output.stat().st_size} bytes, "
                  f"{frame.width}x{frame.height} decoded frame)"
              )

          science_manifest_path = Path(
              "outputs/science-aware-cinematic-smoke.manifest.json"
          )
          science_manifest = json.loads(
              science_manifest_path.read_text(encoding="utf-8")
          )
          assert science_manifest["scenario_label"] == "b1-b2-science-aware-smoke"
          assert science_manifest["seed"] == 17
          assert science_manifest["focal_trait_name"] == "max_speed"
          assert science_manifest["focal_label"] == "Maximum speed"
          assert science_manifest["director_mode"] == "generic"
          assert science_manifest["renderer_name"] == "manim"
          assert science_manifest["renderer_version"]
          assert science_manifest["quality"] == "low"
          print(f"Verified reproducibility manifest: {science_manifest_path}")

          b3_manifest_path = Path("outputs/b3-director-smoke.manifest.json")
          b3_manifest = json.loads(b3_manifest_path.read_text(encoding="utf-8"))
          assert b3_manifest["scenario_label"] == "b3-environment-dependent-max-speed"
          assert b3_manifest["director_mode"] == "b3_flagship"
          assert b3_manifest["representative_seed"] == 5
          assert b3_manifest["primary_step"] == 30
          assert b3_manifest["focal_trait_name"] == "max_speed"
          assert b3_manifest["focal_lower_bound"] == 1
          assert b3_manifest["focal_upper_bound"] == 4
          assert b3_manifest["low_speed_organism_id"] == 16
          assert b3_manifest["low_speed_completed_step"] == 7
          assert b3_manifest["high_speed_organism_id"] == 1
          assert b3_manifest["high_speed_completed_step"] == 5
          assert b3_manifest["confirmation_seed_count"] == 0
          assert b3_manifest["includes_radius2_sensitivity"] is False
          assert b3_manifest["renderer_name"] == "manim"
          assert b3_manifest["renderer_version"]
          assert b3_manifest["quality"] == "low"
          print(f"Verified B3 director manifest: {b3_manifest_path}")
          PY
      - name: Upload smoke renders
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-smoke-${{ github.run_id }}
          path: |
            outputs/cinematic-smoke.mp4
            outputs/science-aware-cinematic-smoke.mp4
            outputs/science-aware-cinematic-smoke.manifest.json
            outputs/b3-director-smoke.mp4
            outputs/b3-director-smoke.manifest.json
          retention-days: 14
          if-no-files-found: error
