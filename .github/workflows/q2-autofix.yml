name: Q2 Autofix

on:
  push:
    branches:
      - q2/native-authoring

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: q2/native-authoring
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9"
      - name: Apply repository Ruff fixes and formatting
        run: |
          ruff check --fix \
            src/evo_engine/desktop/controllers/application.py \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/controllers/experiment.py \
            src/evo_engine/desktop/controllers/reference.py \
            src/evo_engine/desktop/controllers/simulation.py \
            tests/desktop/test_authoring_controllers.py
          ruff format \
            src/evo_engine/desktop/controllers/application.py \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/controllers/experiment.py \
            src/evo_engine/desktop/controllers/reference.py \
            src/evo_engine/desktop/controllers/simulation.py \
            tests/desktop/test_authoring_controllers.py
      - name: Commit mechanical formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/evo_engine/desktop/controllers/application.py \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/controllers/experiment.py \
            src/evo_engine/desktop/controllers/reference.py \
            src/evo_engine/desktop/controllers/simulation.py \
            tests/desktop/test_authoring_controllers.py
          git commit -m "Apply Ruff formatting to Q2 authoring"
          git push origin HEAD:q2/native-authoring
