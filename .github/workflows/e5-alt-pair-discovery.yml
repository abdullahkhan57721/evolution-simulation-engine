name: E5 Bounded Alternative Pair Discovery

on:
  push:
    branches:
      - e5/drift-weak-selection
    paths:
      - ".github/workflows/e5-alt-pair-discovery.yml"

permissions:
  contents: read

jobs:
  alternative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e5/drift-weak-selection
      - uses: ./.github/actions/setup-quality
      - name: Run one predeclared 3-vs-2 discovery diagnostic
        run: |
          venv/bin/python scripts/e5_drift.py \
            --mode discovery \
            --weak-pair 3-2 \
            --output outputs/e5-validation/e5-discovery-3-vs-2.json
      - name: Upload bounded alternative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-discovery-3-vs-2-${{ github.run_id }}
          path: outputs/e5-validation/e5-discovery-3-vs-2.json
          retention-days: 30
          if-no-files-found: warn
