name: Issue 98 Mechanical Migration

on:
  push:
    branches:
      - issue-98-investment-production-sources

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Apply Issue 98 mechanical API migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-98-investment-production-sources
      - name: Apply settled API renames
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (Path('src'), Path('tests'), Path('examples'), Path('scripts'))
          replacements = (
              ('parental_investment=', 'reproductive_energy_investment='),
              ('.parental_investment', '.reproductive_energy_investment'),
              ('RandomParentLocation', 'RandomProductionSourceLocation'),
              ('participant_energy_contributions', 'investor_energy_contributions'),
          )

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*.py'):
                  text = path.read_text()
                  updated = text
                  for old, new in replacements:
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)

          path = Path('src/evo_engine/processes/reproduction.py')
          text = path.read_text()
          text = text.replace(
              '                raise ValueError("total investor energy contribution must be at least 1.")',
              '                raise ValueError(\n'
              '                    "total investor energy contribution must be at least 1."\n'
              '                )',
          )
          path.write_text(text)
          PY
          rm .github/workflows/issue98-mechanical-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Apply Issue 98 mechanical API migration'
          git push origin HEAD:issue-98-investment-production-sources
