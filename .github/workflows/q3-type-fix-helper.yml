name: Q3 type fix helper

on:
  push:
    branches: [q3/native-execution-results]
    paths:
      - ".github/workflows/q3-type-fix-helper.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: q3/native-execution-results
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply exact Pyright fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/evo_engine/desktop/controllers/run.py",
              '''    @Property(bool, notify=planChanged)\n    def planOpen(self) -> bool:  # noqa: N802\n        return self._plan_open\n\n''',
              '''    def is_plan_open(self) -> bool:\n        return self._plan_open\n\n    @Property(bool, notify=planChanged)\n    def planOpen(self) -> bool:  # noqa: N802\n        return self.is_plan_open()\n\n''',
          )
          replace(
              "src/evo_engine/desktop/controllers/application.py",
              '''    @Property(bool, notify=runPlanChanged)\n    def runPlanOpen(self) -> bool:  # noqa: N802\n        return self._run.planOpen\n''',
              '''    @Property(bool, notify=runPlanChanged)\n    def runPlanOpen(self) -> bool:  # noqa: N802\n        return self._run.is_plan_open()\n''',
          )

          results = "src/evo_engine/desktop/controllers/results.py"
          replace(
              results,
              '''from PySide6.QtCore import Property, QObject, Signal\n\nfrom evo_engine.desktop.artifacts import (\n''',
              '''from PySide6.QtCore import Property, QObject, Signal\n\nfrom evo_engine.desktop.artifacts import (\n''',
          )
          replace(
              results,
              '''from evo_engine.experiments.e4_selection import E4_FOCAL_SPEEDS\n''',
              '''from evo_engine.experiments.e4_selection import E4_FOCAL_SPEEDS\nfrom evo_engine.experiments.locomotion import LocomotionReplicateMeasurements\nfrom evo_engine.experiments.science import ScientificRunProvenance\n''',
          )
          replace(
              results,
              '''    WorkbenchRunResult,\n)\n''',
              '''    WorkbenchRunProvenance,\n    WorkbenchRunResult,\n)\n''',
          )
          replace(
              results,
              '''        else:\n            value = view.locomotion\n            self._analysis.set_items(\n''',
              '''        else:\n            value = cast(LocomotionReplicateMeasurements, view.locomotion)\n            self._analysis.set_items(\n''',
          )
          replace(
              results,
              '''from __future__ import annotations\n\nfrom PySide6.QtCore import Property, QObject, Signal\n''',
              '''from __future__ import annotations\n\nfrom typing import cast\n\nfrom PySide6.QtCore import Property, QObject, Signal\n''',
          )
          replace(
              results,
              '''    def _set_revision_provenance(self, provenance, scientific) -> None:\n''',
              '''    def _set_revision_provenance(\n        self,\n        provenance: WorkbenchRunProvenance,\n        scientific: ScientificRunProvenance | None,\n    ) -> None:\n''',
          )

          test = "tests/desktop/test_run_results_controllers.py"
          replace(test, '''    assert run.planOpen\n''', '''    assert run.is_plan_open()\n''')
          replace(test, '''        assert run.expandedRunCount > 0\n''', '''        assert cast(int, run.property("expandedRunCount")) > 0\n''')
          replace(
              test,
              '''    assert _run(controller).bindingNotice.startswith(\n        "Pending Simulation/Evidence edits were bound atomically"\n    )\n''',
              '''    assert cast(str, _run(controller).property("bindingNotice")).startswith(\n        "Pending Simulation/Evidence edits were bound atomically"\n    )\n''',
          )
          replace(
              test,
              '''    assert "Pending Experiment edits" in _run(controller).bindingNotice\n''',
              '''    assert "Pending Experiment edits" in cast(\n        str, _run(controller).property("bindingNotice")\n    )\n''',
          )
          replace(
              test,
              '''    assert "provenance is not a result archive" in results.historicalMessage\n''',
              '''    assert "provenance is not a result archive" in cast(\n        str, results.property("historicalMessage")\n    )\n''',
          )
          PY

          python -m pip install --quiet -e ".[dev]" -r requirements-desktop.txt -r requirements-ui.txt
          ruff check --fix \
            src/evo_engine/desktop/controllers/application.py \
            src/evo_engine/desktop/controllers/run.py \
            src/evo_engine/desktop/controllers/results.py \
            tests/desktop/test_run_results_controllers.py
          ruff format \
            src/evo_engine/desktop/controllers/application.py \
            src/evo_engine/desktop/controllers/run.py \
            src/evo_engine/desktop/controllers/results.py \
            tests/desktop/test_run_results_controllers.py
          pyright src/evo_engine/desktop tests/desktop
      - name: Commit product-only type fixes
        shell: bash
        run: |
          rm .github/workflows/q3-type-fix-helper.yml
          git config user.name "Abdullah Khan"
          git config user.email "137455050+abdullahkhan57721@users.noreply.github.com"
          git add -A
          git commit -m "Q3: make native Run and Results type-safe"
          git push origin HEAD:q3/native-execution-results
