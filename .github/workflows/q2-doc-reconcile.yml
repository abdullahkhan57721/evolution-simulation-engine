name: Q2 documentation reconciliation helper

on:
  push:
    branches:
      - q2/native-authoring
    paths:
      - .github/workflows/q2-doc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q2/native-authoring

      - name: Reconcile Q2 native authoring documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected documentation block not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          current = Path("docs/development/current_state.md")
          replace_once(
              current,
              """Q0 established that PySide6 + Qt Quick/QML can consume the settled Workbench\ndirectly. Q1 turns that technology proof into the persistent native product shell,\nwhile scientific authority remains in the existing Workbench artifacts. The durable\ndependency boundary is:\n""",
              """Q0 established that PySide6 + Qt Quick/QML can consume the settled Workbench\ndirectly. Q1 turned that technology proof into the persistent native product shell,\nand Q2 completes the first native pre-execution scientific authoring surface across\nSimulation, Evidence, and Experiment. Scientific authority remains in the existing\nWorkbench artifacts. The durable dependency boundary is:\n""",
          )
          replace_once(
              current,
              """Reference Ecology remains the deep native slice inherited from Q0. Its\nfamily-specific `ReferenceStudyController` owns only the transient `max_speed` draft,\nimmutable child commit, narrow worker-thread execution, authoritative Reference\nresult, and renderer-neutral world preparation. Other families now participate in\nthe real shell and exact persistence path without gaining speculative Q1 authoring or\nexecution parity.\n""",
              """Q2 fills the native Simulation, Evidence, and Experiment sections without\nintroducing another scientific schema. `SimulationAuthoringController` owns\ncontrolled-locomotion draft semantics plus read-only E3/E4/B3 Simulation meaning,\nwhile `ReferenceStudyController` now owns the bounded WB4 Guided/Advanced Reference\ndraft, applicability reconciliation, immutable child commit, and the retained Q0\nworker-thread run/result/world vertical. `EvidenceAuthoringController` owns only\ntransient controlled/reference evidence-plan selection and immutable child commits;\nB3/E3/E4 evidence remains locked by the existing scientific designs.\n`ExperimentAuthoringController` edits only the existing E3 levels/seeds and E4 seeds,\nand displays authoritative Workbench expansion rows; B3 stays curated/read-only and\ncontrolled/reference Studies remain explicit single-run workflows.\n""",
          )
          replace_once(
              current,
              """The next native product work should extend those settled seams rather than redesign\nthe application shell:\n\n1. **Q2 — Simulation authoring:** add family-specific Simulation controls against\n   existing Workbench semantic authoring while leaving application routing and exact\n   persistence alone.\n2. **Q3 — Evidence and Experiment:** add concrete Evidence/Experiment controllers\n   using the same exact-owner/reset contract and existing Workbench semantics.\n3. **Q4 — execution and Results breadth:** add execution/Results support and\n   family-specific result models while binding only authoritative existing Workbench\n   results.\n""",
              """The next native product work should extend those settled seams rather than redesign\nthe application shell:\n\n1. **Q3 — execution and Results breadth:** broaden execution beyond the retained\n   Reference path and add family-specific native Results consumers over only\n   authoritative existing Workbench runners, result inspectors, provenance, and WB5\n   association rules.\n2. **Later native Presentation breadth:** expand replay/presentation from recorded\n   evidence after Results ownership is settled, beginning with existing Reference and\n   canonical B3 presentation contracts rather than a universal scene model.\n3. **Product hardening after functional breadth:** accessibility, visual completion,\n   packaging/release hardening, and an explicit Streamlit parity/removal decision\n   remain downstream product work.\n""",
          )
          replace_once(
              current,
              """Q1 establishes the native shell, concrete five-family routing, exact persistence,\nand application ownership semantics, but it is not desktop parity. Reference Ecology\nremains the only deep native edit/run/world slice. Broader Simulation authoring,\nEvidence/Experiment editing, execution/Results breadth, Presentation parity,\naccessibility, and release hardening remain Q2+ application work. This is\napplication-layer incompleteness, not a reason to broaden Workbench or the kernel.\n""",
              """Q1 and Q2 establish the native shell, concrete five-family routing, exact\npersistence, application ownership semantics, and complete currently supported\npre-execution Simulation/Evidence/Experiment authoring. Reference Ecology still owns\nthe only deep native execution/result/world slice. Broader execution/Results,\nPresentation parity, accessibility, and release hardening remain Q3+ application\nwork. This is application-layer incompleteness, not a reason to broaden Workbench or\nthe kernel.\n""",
          )

          roadmap = Path("docs/development/roadmap.md")
          start = "### Q2 — Simulation authoring\n"
          end = "### Later native product direction\n"
          roadmap_text = roadmap.read_text(encoding="utf-8")
          if start not in roadmap_text or end not in roadmap_text:
              raise SystemExit("Expected Q2/Q3/Q4 roadmap section not found")
          prefix, rest = roadmap_text.split(start, 1)
          _, suffix = rest.split(end, 1)
          roadmap_block = """### Q2 — Native Simulation, Evidence, and Experiment authoring (completed)\n\nQ2 intentionally combines the previously separate Simulation and\nEvidence/Experiment authoring fronts because one coherent product task owns the full\npre-execution scientific Study definition. It reuses the Q1 application shell, exact\nartifact routing, active-owner/reset semantics, and family-controller seam rather\nthan redesigning them.\n\nQ2 establishes:\n\n1. controlled-locomotion Simulation authoring for only maximum speed, resource\n   geography, and seed, with existing readiness, immutable child revision, and\n   semantic-diff contracts;\n2. bounded Reference Ecology Guided/Advanced authoring using WB4 applicability and\n   transient reconciliation, with Expert still empty and Extension/Internal still\n   non-authorable;\n3. inspectable selected, derived, and frozen recipe meaning through curated Qt item\n   models rather than Python object dumps;\n4. canonical B3 read-only Simulation semantics plus only the existing radius-2\n   sensitivity fork and explicit validated-identity loss;\n5. controlled/reference Evidence authoring through only the existing concrete\n   EvidencePlan types and immutable child revisions, while required B3/E3/E4 evidence\n   remains locked and missing-evidence implications stay explicit;\n6. concrete E3 level/seed and E4 seed editing with authoritative Workbench expansion\n   rows preserving factor, role, standing-composition, and counterbalance semantics;\n7. curated/read-only B3 Experiment case counts and explicit controlled/reference\n   single-run semantics rather than a generic experiment definition;\n8. thin `SimulationAuthoringController`, `EvidenceAuthoringController`, and\n   `ExperimentAuthoringController` seams plus Reference-specific authoring retained in\n   `ReferenceStudyController`;\n9. application-level stale result, Run Plan, and presentation reset on scientific\n   draft/owner changes while section navigation remains scientifically inert; and\n10. native QML authoring views and read-only Qt item models without a universal Study\n    schema, reflection-driven form system, generic experiment DSL, or QML-owned\n    scientific validation.\n\n### Q3 — execution and Results breadth\n\nQ3 should broaden execution and Results beyond the retained Q0/Q2 Reference path\nusing only existing concrete Workbench runners, result inspectors, provenance, and\nWB5 association rules. Result binding must continue to require exact active-owner\ncompatibility, and missing evidence must remain unavailable rather than reconstructed.\n\nAdd family-specific Qt item models/view models only where concrete Results consumers\nneed them. Do not flatten heterogeneous controlled/E3/E4/B3/Reference results into a\nuniversal result or statistics model. Preserve the Q2 authoring-draft rule: Run must\noperate on exact saved scientific ownership, with pending revision-backed edits\ncommitted through their existing immutable contracts before execution rather than\nmutating saved science in place.\n\n"""
          roadmap.write_text(prefix + roadmap_block + end + suffix, encoding="utf-8")
          replace_once(
              roadmap,
              """After Q4, expand Presentation from recorded evidence: broader Reference world\nexploration, canonical B3 matched replay and existing cinematic handoff, then native\naccessibility, visual completion, packaging/release hardening, and an explicit\nStreamlit parity/removal decision when justified.\n""",
              """After Q3, expand Presentation from recorded evidence: broader Reference world\nexploration, canonical B3 matched replay and existing cinematic handoff, then native\naccessibility, visual completion, packaging/release hardening, and an explicit\nStreamlit parity/removal decision when justified.\n""",
          )

          desktop = Path("docs/desktop_workbench.md")
          replace_once(
              desktop,
              """Q0 establishes **PySide6 + Qt Quick/QML** as the primary product frontend architecture\nfor the Evolution Experiment Workbench. The Streamlit WU1–WU5 application remains a\nreference frontend during migration; it does not become a second scientific model.\n""",
              """Q0 establishes **PySide6 + Qt Quick/QML** as the primary product frontend architecture\nfor the Evolution Experiment Workbench. Q1 establishes the persistent native Study\nshell and concrete routing; Q2 completes the currently supported pre-execution\nSimulation/Evidence/Experiment authoring surface. The Streamlit WU1–WU5 application\nremains a reference frontend during migration; it does not become a second scientific\nmodel.\n""",
          )
          marker = "## Q2 / Q3 / Q4 interface handoff\n"
          desktop_text = desktop.read_text(encoding="utf-8")
          if marker not in desktop_text:
              raise SystemExit("Expected desktop Q1 handoff marker not found")
          before, after = desktop_text.split(marker, 1)
          refs_marker = "## References\n"
          if refs_marker not in after:
              raise SystemExit("Expected desktop references marker not found")
          _, refs = after.split(refs_marker, 1)
          q2_section = """## Q2 native scientific authoring\n\nQ2 fills the three pre-execution scientific sections while preserving the Q1\napplication and persistence boundaries:\n\n```text\nApplicationController\n├── SimulationAuthoringController\n├── EvidenceAuthoringController\n├── ExperimentAuthoringController\n└── ReferenceStudyController\n```\n\nThese are concrete application seams, not a common scientific object model. The\napplication controller activates all four against one exact concrete artifact and\nresets stale current-session result, Run Plan, and presentation state whenever a\nscientific draft or exact owner changes. Section navigation itself remains inert.\n\n### Simulation authoring\n\n`SimulationAuthoringController` owns controlled-locomotion transient intent for only\nmaximum speed, resource geography, and seed. It delegates readiness, immutable child\ncreation, and semantic diff to the existing Workbench/frontend-neutral authoring\ncontracts. E3/E4 Simulation factor assumptions remain read-only because their\nexperiment definitions own those semantics. B3 remains curated/read-only except for\nthe already-supported radius-2 sensitivity fork, whose existing diff exposes loss of\nvalidated canonical identity.\n\nReference Ecology remains family-specific in `ReferenceStudyController`. Q2 expands\nthat controller from the Q0 max-speed proof to the bounded WB4 Guided/Advanced\nsurface, including Gaussian, two-patch, and mutation applicability. Inapplicable\ntransient values reconcile through the existing normalization helper; saved\nnormalization and readiness remain Workbench-owned. Expert remains empty and\nExtension/Internal capability is not exposed. The retained Reference run/result/world\nvertical remains in the same family controller and still runs only exact saved\nscience.\n\nThe native Simulation view consumes separate read-only item models for **You\nselected**, **Derived configuration**, **Frozen recipe assumptions**, and the existing\nsemantic diff. QML never receives the mutable Workbench manifest/revision graph.\n\n### Evidence authoring\n\n`EvidenceAuthoringController` owns only transient evidence IDs for controlled and\nReference revision-backed Studies. Option rows come from the existing concrete\nevidence authoring helpers and carry scientific label, meaning, enabled analysis,\nrequired/editable state, and selection. Saving creates a new immutable child through\nthe owning concrete evidence-plan contract.\n\nReference advisories, including high-volume spatial evidence warnings, are passed\nthrough existing Workbench diagnostics. Missing optional evidence explicitly states\nthat the corresponding analysis cannot be reconstructed later. B3, E3, and E4\nrequired evidence remains locked/read-only.\n\n### Experiment authoring\n\n`ExperimentAuthoringController` owns only the existing concrete experiment\ndefinitions. E3 edits supported maximum-speed levels and replicate seeds. E4 edits\nreplicate seeds while resource geography, control/treatment roles, standing focal\ncomposition, and founder-order counterbalance remain fixed and separately visible.\nThe controller rebuilds its run rows only through the existing Workbench expansion\nhelpers.\n\nB3 remains a read-only curated compiled design with authoritative case counts. A\ncontrolled Study and Reference Ecology explicitly remain single-run workflows; Q2\ndoes not invent a generic experiment object for them.\n\n### Qt model boundary\n\n`evo_engine.desktop.models.authoring` contains only small read-only Qt item models for\nscientific meaning, semantic diff rows, evidence choices, factor levels, and\nexperiment-run rows. They are scalar presentation values over existing scientific\ncontracts, not persistence or validation schemas. QML authoring is split into\n`SimulationAuthoringView.qml`, `EvidenceAuthoringView.qml`, and\n`ExperimentAuthoringView.qml`, with `SemanticDiffView.qml` as the one reusable diff\npresentation primitive earned by multiple concrete families.\n\n## Q3 execution / Results handoff\n\nThe following Q1/Q2 seams are intended to remain stable for the next native front:\n\n- `ApplicationController` routing, exact concrete artifact ownership, file ownership,\n  and stale result/Run Plan/presentation reset semantics;\n- exact loader/serializer dispatch in `evo_engine.desktop.artifacts`;\n- family-specific authoring controllers rather than a universal desktop scientific\n  model;\n- transient scientific drafts that cannot be executed as if they were saved science;\n- existing immutable revision/fork or concrete experiment-definition replacement\n  semantics for authoring commits;\n- curated scalar Qt properties and read-only item-model rows at the QML boundary;\n- the retained narrow Reference worker thread as evidence that synchronous Workbench\n  runners must not block the GUI thread; and\n- WB5 exact result-owner association as the authority for binding Results.\n\nQ3 should add execution and Results family-by-family over the five existing concrete\nWorkbench runners and inspectors. Missing evidence remains unavailable rather than\nreconstructed, and heterogeneous controlled/E3/E4/B3/Reference outputs should gain\nonly the concrete Qt result models their native consumers require.\n\nThe following remain intentionally unsettled and must not be inferred from Q2:\n\n- a universal Study class or common persisted schema;\n- generic authoring metadata/forms;\n- a generic experiment/result/statistics hierarchy;\n- a generic background-job/cancellation framework;\n- cross-family presentation models;\n- native release/signing/update architecture;\n- removal of the Streamlit reference frontend.\n\n"""
          desktop.write_text(before + q2_section + refs_marker + refs, encoding="utf-8")
          replace_once(
              desktop,
              """- GitHub Issue #201 / PR #202\n""",
              """- GitHub Issue #201 / PR #202\n- GitHub Issue #203 / PR #204\n""",
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/desktop_workbench.md docs/development/current_state.md docs/development/roadmap.md
          git commit -m "Q2: reconcile native authoring documentation"
          git push origin HEAD:q2/native-authoring
