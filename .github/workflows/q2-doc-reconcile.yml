name: Q2 documentation reconciliation helper

on:
  push:
    branches:
      - q2/native-authoring
    paths:
      - .github/workflows/q2-doc-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q2/native-authoring

      - name: Remove stale Q1-only wording
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected documentation block not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          current = Path("docs/development/current_state.md")
          replace_once(
              current,
              """reference product, Q0 native technology proof, and **Q1 native persistent Study\nshell** are established.\n\nPySide6 + Qt Quick/QML is the primary product architecture without moving scientific\nauthority out of Workbench. Q1 has established Home/New/Open, exact concrete routing\nand persistence for the current five-family support envelope, persistent\n`Simulation / Evidence / Experiment / Results / Presentation` navigation, exact\nactive-owner/reset semantics, a family-specific controller seam, reusable native\nQML primitives, and the retained Reference Ecology deep slice.\n""",
              """reference product, Q0 native technology proof, **Q1 native persistent Study\nshell**, and **Q2 native pre-execution scientific authoring** are established.\n\nPySide6 + Qt Quick/QML is the primary product architecture without moving scientific\nauthority out of Workbench. Q1 established Home/New/Open, exact concrete routing and\npersistence for the current five-family support envelope, persistent\n`Simulation / Evidence / Experiment / Results / Presentation` navigation, exact\nactive-owner/reset semantics, and reusable native QML primitives. Q2 adds the\ncurrently supported Simulation/Evidence/Experiment authoring through concrete thin\ncontrollers while retaining Reference Ecology as the only deep native\nexecution/result/world slice.\n""",
          )
          replace_once(
              current,
              "WU2–WU5 and Q0–Q1 promote no capability merely because the lower engine can\nrepresent it.\n",
              "WU2–WU5 and Q0–Q2 promote no capability merely because the lower engine can\nrepresent it.\n",
          )
          replace_once(
              current,
              "WB1, WB2, WB3, and WB4 persist different shapes because their responsibilities still\ndiffer. WB5/WB6, WU1–WU5, and Q0–Q1 still do not reveal enough identical persistence\nor execution responsibility to earn a universal saved Study/Experiment/Results root.\nQ1 reinforces the intended approach by routing concrete formats directly rather than\nmanufacturing one for Qt.\n",
              "WB1, WB2, WB3, and WB4 persist different shapes because their responsibilities still\ndiffer. WB5/WB6, WU1–WU5, and Q0–Q2 still do not reveal enough identical persistence\nor execution responsibility to earn a universal saved Study/Experiment/Results root.\nQ1/Q2 reinforce the intended approach by routing and authoring concrete formats\ndirectly rather than manufacturing one for Qt.\n",
          )

          desktop = Path("docs/desktop_workbench.md")
          replace_once(
              desktop,
              """`ReferenceStudyController` now owns only the retained Reference Ecology deep slice:\nits transient `max_speed` draft, immutable child commit, narrow worker-thread run,\nauthoritative Reference result, and renderer-neutral world preparation. It receives\nan exact active `ReferenceStudyRevision` from `ApplicationController`; it is not the\napplication router or persistence dispatcher.\n\nThis separation is intentional. Other families should get concrete downstream\ncontrollers when Q2–Q4 need real family behavior rather than accumulating unrelated\nlogic in one universal controller.\n""",
              """Q1 originally kept `ReferenceStudyController` as the one deep family slice: a\ntransient `max_speed` draft, immutable child commit, narrow worker-thread run,\nauthoritative Reference result, and renderer-neutral world preparation. It receives\nan exact active `ReferenceStudyRevision` from `ApplicationController`; it is not the\napplication router or persistence dispatcher. Q2 preserves that family boundary while\nexpanding Reference authoring and adding separate concrete Simulation, Evidence, and\nExperiment controllers, as described below.\n""",
          )
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/desktop_workbench.md docs/development/current_state.md
          git commit -m "Q2: remove stale Q1-only documentation wording"
          git push origin HEAD:q2/native-authoring
