name: Q2 Typefix

on:
  push:
    branches:
      - q2/native-authoring

permissions:
  contents: write

jobs:
  typefix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: q2/native-authoring
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply narrow Pyright surface fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new))

          models = "src/evo_engine/desktop/models/authoring.py"
          replace(
              models,
              "class _MeaningRole(IntEnum):\n    label = int(Qt.ItemDataRole.UserRole) + 1\n    value = label + 1",
              "class _MeaningRole(IntEnum):\n    label = int(Qt.ItemDataRole.UserRole) + 1\n    item_value = label + 1",
          )
          replace(models, "int(_MeaningRole.value)", "int(_MeaningRole.item_value)")
          replace(
              models,
              "class _FactorLevelRole(IntEnum):\n    value = int(Qt.ItemDataRole.UserRole) + 1\n    selected = value + 1",
              "class _FactorLevelRole(IntEnum):\n    level_value = int(Qt.ItemDataRole.UserRole) + 1\n    selected = level_value + 1",
          )
          replace(models, "int(_FactorLevelRole.value)", "int(_FactorLevelRole.level_value)")

          evidence = "src/evo_engine/desktop/controllers/evidence.py"
          old = '''    @Property(str, notify=draftChanged)\n    def readinessMessage(self) -> str:  # noqa: N802\n        artifact = self._artifact\n        if not isinstance(artifact, (StudyRevision, ReferenceStudyRevision)):\n            return "Required evidence is fixed by this scientific design."\n        plan = make_editable_evidence_plan(artifact, self._requested)\n        readiness = (\n            assess_readiness(artifact.intent, plan)\n            if isinstance(plan, EvidencePlan)\n            else assess_reference_readiness(artifact.intent, plan)\n        )\n        if not readiness.diagnostics:\n            return "Ready"\n        return " · ".join(item.message for item in readiness.diagnostics)\n'''
          new = '''    @Property(str, notify=draftChanged)\n    def readinessMessage(self) -> str:  # noqa: N802\n        return self._readiness_message()\n\n    def _readiness_message(self) -> str:\n        artifact = self._artifact\n        if isinstance(artifact, StudyRevision):\n            plan = make_editable_evidence_plan(artifact, self._requested)\n            assert isinstance(plan, EvidencePlan)\n            readiness = assess_readiness(artifact.intent, plan)\n        elif isinstance(artifact, ReferenceStudyRevision):\n            plan = make_editable_evidence_plan(artifact, self._requested)\n            assert isinstance(plan, ReferenceEvidencePlan)\n            readiness = assess_reference_readiness(artifact.intent, plan)\n        else:\n            return "Required evidence is fixed by this scientific design."\n        if not readiness.diagnostics:\n            return "Ready"\n        return " · ".join(item.message for item in readiness.diagnostics)\n'''
          replace(evidence, old, new)
          replace(
              evidence,
              "            self._set_status(self.readinessMessage)\n            return False",
              "            self._set_status(self._readiness_message())\n            return False",
          )

          tests = "tests/desktop/test_authoring_controllers.py"
          replacements = {
              '    assert not reference.hasExpertControls\n': '    assert getattr(reference, "hasExpertControls") is False\n',
              '    reference.draftExplorationMovement = "gaussian"\n': '    setattr(reference, "draftExplorationMovement", "gaussian")\n',
              '    reference.draftGaussianStandardDeviation = 4\n': '    setattr(reference, "draftGaussianStandardDeviation", 4)\n',
              '    reference.draftExplorationMovement = "moore"\n': '    setattr(reference, "draftExplorationMovement", "moore")\n',
              '    reference.draftResourceGeography = "two_patches"\n': '    setattr(reference, "draftResourceGeography", "two_patches")\n',
              '    reference.draftPatch1Radius = 3\n': '    setattr(reference, "draftPatch1Radius", 3)\n',
              '    reference.draftResourceGeography = "uniform"\n': '    setattr(reference, "draftResourceGeography", "uniform")\n',
              '    reference.draftMutationEnabled = True\n': '    setattr(reference, "draftMutationEnabled", True)\n',
              '    reference.draftMutationProbability = 500\n': '    setattr(reference, "draftMutationProbability", 500)\n',
              '    reference.draftMutationMaxChange = 2\n': '    setattr(reference, "draftMutationMaxChange", 2)\n',
              '    reference.draftMutationEnabled = False\n': '    setattr(reference, "draftMutationEnabled", False)\n',
              '    reference.draftMaxSpeed = 4 if reference.draftMaxSpeed != 4 else 3\n': '    reference.set_draft_max_speed(4 if reference.draftMaxSpeed != 4 else 3)\n',
              '    assert "cannot be reconstructed" in evidence.missingEvidenceMessage\n': '    assert "cannot be reconstructed" in str(getattr(evidence, "missingEvidenceMessage"))\n',
              '    assert "storage grows" in evidence.advisoryMessage\n': '    assert "storage grows" in str(getattr(evidence, "advisoryMessage"))\n',
              '    assert "Founder-order counterbalance" in experiment.counterbalanceLabel\n': '    assert "Founder-order counterbalance" in str(getattr(experiment, "counterbalanceLabel"))\n',
              '    assert experiment.b3TotalSimulations > 0\n': '    assert int(getattr(experiment, "b3TotalSimulations")) > 0\n',
          }
          for old_text, new_text in replacements.items():
              replace(tests, old_text, new_text)
          PY
      - name: Format and lint touched Python
        run: |
          python -m pip install "ruff>=0.9"
          ruff check --fix \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/models/authoring.py \
            tests/desktop/test_authoring_controllers.py
          ruff format \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/models/authoring.py \
            tests/desktop/test_authoring_controllers.py
      - name: Commit narrow type-surface fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/evo_engine/desktop/controllers/evidence.py \
            src/evo_engine/desktop/models/authoring.py \
            tests/desktop/test_authoring_controllers.py
          git commit -m "Fix Q2 desktop type surfaces"
          git push origin HEAD:q2/native-authoring
