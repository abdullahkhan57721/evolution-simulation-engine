name: Q3 one-shot documentation update

on:
  push:
    branches:
      - q3/native-execution-results
    paths:
      - .github/workflows/q3-docs-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q3/native-execution-results
          fetch-depth: 0
      - name: Update durable Q3 orientation
        run: python scripts/_q3_docs_once.py
      - name: Remove one-shot helpers and commit
        run: |
          rm scripts/_q3_docs_once.py .github/workflows/q3-docs-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record completed Q3 native execution Results architecture"
          git push origin HEAD:q3/native-execution-results
