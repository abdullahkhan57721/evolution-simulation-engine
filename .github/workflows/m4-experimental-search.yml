name: M4 Experimental Search

on:
  push:
    branches: [m4-experimental-search]

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run isolated resource-selection sweep
        shell: bash
        run: |
          python - <<'PY'
          from collections import Counter
          import json, statistics
          import attrs
          from evo_engine.behavior import EnergyConservationBehavior
          from evo_engine.engine import Simulation
          from evo_engine.energetics import DevelopmentalEnergyThreshold
          from evo_engine.genetics import ENERGY_CONSERVATION_THRESHOLD
          from evo_engine.observation import EventRecorder, GeneticCompositionRecorder, PedigreeRecorder, PopulationRecorder
          from evo_engine.presets import ReferenceEcologyConfig
          from evo_engine.presets.reference_ecology.builders import build_reference_engine
          from evo_engine.presets.reference_ecology.genetics import build_reference_founder_genome, build_reference_genetic_architecture
          from evo_engine.presets.reference_ecology.mating_types import reference_founder_mating_type
          from evo_engine.world import Organism, WorldState

          SEEDS=(11,23,37,41,59,73,89,101)
          CANDIDATES=(("sensory_range",2,10),("max_speed",1,4),("assimilation_efficiency",50,100),("max_intake_rate",2,8),("metabolic_cost_coefficient",15,60))
          DEPOSITS=(4,8,16)
          CHECKPOINTS=(10,20,30,40)

          def build_world(config, trait_name, low, high):
              architecture=build_reference_genetic_architecture(config)
              genomes=[]
              for value in (low,high):
                  variant=attrs.evolve(config,traits=attrs.evolve(config.traits,**{trait_name:value}))
                  genomes.append(build_reference_founder_genome(architecture,variant))
              world=WorldState(width=config.width,height=config.height)
              for index in range(config.initial_population):
                  variant=0 if index%4 in (0,3) else 1
                  world.add_organism(Organism.from_genome(
                      genetic_architecture=architecture,genome=genomes[variant],age=0,
                      energy=config.initial_energy,mating_type=reference_founder_mating_type(index),
                      x=index%config.width,y=index//config.width))
              return architecture,world

          def run_one(name,low,high,deposits,seed):
              base=ReferenceEcologyConfig()
              # attack <= defense disables the existing attack/defense predation gate;
              # all other life-history defaults remain reference values.
              traits=attrs.evolve(base.traits,attack_strength=0,defense=1)
              config=ReferenceEcologyConfig(
                  initial_population=20,initial_energy=30,max_steps=40,seed=seed,
                  traits=traits,mutation_probability_ppm=0,
                  resource_generation_amount=6,resource_deposits_per_step=deposits)
              architecture,world=build_world(config,name,low,high)
              simulation=Simulation(
                  initial_domain_state=world,genetic_architecture=architecture,seed=seed,
                  behavior_selection_model=EnergyConservationBehavior(
                      energy_threshold=DevelopmentalEnergyThreshold(trait_name=ENERGY_CONSERVATION_THRESHOLD)))
              pop=PopulationRecorder(trait_names=(name,)); gen=GeneticCompositionRecorder(locus_names=(name,)); events=EventRecorder(); pedigree=PedigreeRecorder()
              engine=build_reference_engine(config,observers=(pop,pedigree,gen),telemetry_observers=(events,pedigree))
              engine.run(simulation)
              counts=Counter(e.process_name for e in events.events)
              points=[]
              for step in CHECKPOINTS:
                  p=pop.observations[min(step,len(pop.observations)-1)]
                  g=gen.observations[min(step,len(gen.observations)-1)].locus(name)
                  points.append({"step":step,"population":p.population_size,
                      "trait_mean":p.trait(name).summary.mean,
                      "high_frequency":g.allele_frequency(high) if p.population_size else None})
              row={"candidate":name,"low":low,"high":high,"deposits":deposits,"seed":seed,
                   "checkpoints":points,"events":dict(sorted(counts.items()))}
              print("M4_RESULT "+json.dumps(row,sort_keys=True)); return row

          for name,low,high in CANDIDATES:
              for deposits in DEPOSITS:
                  rows=[run_one(name,low,high,deposits,s) for s in SEEDS]
                  for step in CHECKPOINTS:
                      pts=[r["checkpoints"][CHECKPOINTS.index(step)] for r in rows]
                      alive=[p for p in pts if p["population"]>0]
                      freqs=[p["high_frequency"] for p in alive]
                      print("M4_SUMMARY "+json.dumps({
                          "candidate":name,"low":low,"high":high,"deposits":deposits,"step":step,
                          "alive_runs":len(alive),"extinctions":len(rows)-len(alive),
                          "mean_population":statistics.fmean(p["population"] for p in pts),
                          "mean_high_frequency":statistics.fmean(freqs) if freqs else None,
                          "positive_shift_runs":sum(f>0.5 for f in freqs),
                          "negative_shift_runs":sum(f<0.5 for f in freqs),
                          "unchanged_runs":sum(f==0.5 for f in freqs),
                          "mean_reproduction_events":statistics.fmean(r["events"].get("Reproduction",0) for r in rows),
                          "mean_predation_events":statistics.fmean(r["events"].get("Predation",0) for r in rows),
                          "mean_starvation_events":statistics.fmean(r["events"].get("Starvation",0) for r in rows),
                      },sort_keys=True))
          PY
