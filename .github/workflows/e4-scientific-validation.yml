name: E4 Scientific Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pyproject.toml"
      - "src/evo_engine/access/**"
      - "src/evo_engine/admission/**"
      - "src/evo_engine/behavior/**"
      - "src/evo_engine/biology/**"
      - "src/evo_engine/characteristics/**"
      - "src/evo_engine/departure/**"
      - "src/evo_engine/energetics/**"
      - "src/evo_engine/engine/**"
      - "src/evo_engine/evolution/**"
      - "src/evo_engine/feeding/**"
      - "src/evo_engine/genetics/**"
      - "src/evo_engine/observation/**"
      - "src/evo_engine/presets/controlled_locomotion/**"
      - "src/evo_engine/processes/**"
      - "src/evo_engine/production/**"
      - "src/evo_engine/propagation/**"
      - "src/evo_engine/reference/**"
      - "src/evo_engine/reproduction/**"
      - "src/evo_engine/resolvers/**"
      - "src/evo_engine/spatial/**"
      - "src/evo_engine/telemetry/**"
      - "src/evo_engine/validation/**"
      - "src/evo_engine/world/**"
      - "src/evo_engine/experiments/__init__.py"
      - "src/evo_engine/experiments/locomotion.py"
      - "src/evo_engine/experiments/science.py"
      - "src/evo_engine/experiments/e3_performance.py"
      - "src/evo_engine/experiments/e4_selection.py"
      - "scripts/e4_selection.py"
      - "tests/experiments/test_e4_selection.py"
      - ".github/actions/setup-quality/action.yml"
      - ".github/workflows/e4-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e4-scientific-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirmation-e4:
    name: Independent E4 confirmation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen unseen-seed confirmation matrix
        run: |
          venv/bin/python scripts/e4_selection.py \
            --mode confirmation \
            --output outputs/e4-validation/e4-confirmation.json
      - name: Upload E4 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-confirmation-${{ github.run_id }}
          path: outputs/e4-validation/e4-confirmation.json
          retention-days: 30
          if-no-files-found: warn

  founder-order-sanity-e4:
    name: E4 founder-order sanity
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run bounded founder-order sanity check
        run: |
          venv/bin/python scripts/e4_selection.py \
            --mode sanity \
            --output outputs/e4-validation/e4-founder-order-sanity.json
      - name: Upload E4 founder-order sanity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-founder-order-sanity-${{ github.run_id }}
          path: outputs/e4-validation/e4-founder-order-sanity.json
          retention-days: 30
          if-no-files-found: warn
