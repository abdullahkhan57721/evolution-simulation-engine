name: E4 Scientific Validation

on:
  pull_request:
    paths:
      - "src/evo_engine/experiments/e4_selection.py"
      - "src/evo_engine/experiments/__init__.py"
      - "scripts/e4_selection.py"
      - "tests/experiments/test_e4_selection.py"
      - "docs/e4_standing_variation.md"
      - "docs/development/current_state.md"
      - "mkdocs.yml"
      - ".github/workflows/e4-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-e4:
    name: Independent E4 confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen unseen-seed confirmation matrix
        run: |
          venv/bin/python scripts/e4_selection.py \
            --mode confirmation \
            --output outputs/e4-validation/e4-confirmation.json
      - name: Upload E4 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-confirmation-${{ github.run_id }}
          path: outputs/e4-validation/e4-confirmation.json
          retention-days: 30
          if-no-files-found: warn

  founder-order-sanity-e4:
    name: E4 founder-order sanity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run bounded founder-order sanity check
        run: |
          venv/bin/python scripts/e4_selection.py \
            --mode sanity \
            --output outputs/e4-validation/e4-founder-order-sanity.json
      - name: Upload E4 founder-order sanity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-founder-order-sanity-${{ github.run_id }}
          path: outputs/e4-validation/e4-founder-order-sanity.json
          retention-days: 30
          if-no-files-found: warn
