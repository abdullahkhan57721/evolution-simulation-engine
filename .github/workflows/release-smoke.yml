name: Release Smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Clean Python 3.12 install and portfolio smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-ui.txt

      - name: Create clean core environment
        shell: bash
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e .

      - name: Verify package metadata and core examples
        shell: bash
        run: |
          venv/bin/python - <<'PY'
          from importlib import metadata

          version = metadata.version("evolution-simulation-engine")
          assert version == "0.1.0", version
          print(f"Installed evolution-simulation-engine {version}")
          PY
          venv/bin/python examples/basic_aging_simulation.py
          venv/bin/python examples/reference_ecology_simulation.py

      - name: Verify flagship experiment and JSON/CSV export
        shell: bash
        run: |
          venv/bin/python - <<'PY'
          from pathlib import Path

          from evo_engine.experiments import (
              run_flagship_max_intake_replicates,
              write_experiment_json,
              write_population_history_csv,
              write_replicate_summary_csv,
          )

          result = run_flagship_max_intake_replicates(seeds=(41,))
          assert result.seeds == (41,), result.seeds

          outputs = (
              write_experiment_json(result, "outputs/release-smoke.json"),
              write_replicate_summary_csv(
                  result,
                  "outputs/release-smoke-summary.csv",
              ),
              write_population_history_csv(
                  result,
                  "outputs/release-smoke-history.csv",
              ),
          )
          for output in outputs:
              path = Path(output)
              assert path.is_file(), path
              assert path.stat().st_size > 0, path

          replicate = result.replicate(41)
          print(
              "Flagship smoke: "
              f"steps={replicate.metadata.completed_steps}, "
              f"final_population={replicate.final_population_size}"
          )
          print("Exports:", *(str(path) for path in outputs))
          PY

      - name: Create clean Streamlit Community Cloud environment
        shell: bash
        run: |
          python -m venv cloud-venv
          cloud-venv/bin/python -m pip install --upgrade pip
          cloud-venv/bin/python -m pip install -r requirements.txt
          cloud-venv/bin/python - <<'PY'
          from importlib import metadata

          import evo_engine
          import plotly
          import streamlit

          version = metadata.version("evolution-simulation-engine")
          assert version == "0.1.0", version
          print(f"Cloud install imported evo_engine {version}")
          print(f"Streamlit {streamlit.__version__}")
          print(f"Plotly {plotly.__version__}")
          print(f"evo_engine package: {evo_engine.__file__}")
          PY

      - name: Verify dashboard launches headlessly
        shell: bash
        run: |
          cloud-venv/bin/python - <<'PY'
          from streamlit.testing.v1 import AppTest

          app = AppTest.from_file("src/evo_engine/ui/app.py").run(timeout=30)
          assert not app.exception
          assert app.title[0].value == "Evolution Simulation Engine"
          labels = {button.label for button in app.button}
          assert "Run flagship evolution demo" in labels
          assert "Run simulation" not in labels

          path = next(
              radio for radio in app.radio if radio.label == "Configuration path"
          )
          path.set_value("Custom experiment")
          app.run(timeout=30)
          assert not app.exception
          labels = {button.label for button in app.button}
          assert "Run simulation" in labels
          assert "Run flagship evolution demo" not in labels
          print("V2 configuration paths verified with Streamlit AppTest")
          PY
