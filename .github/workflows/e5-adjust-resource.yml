name: E5 Bounded Resource Adjustment

on:
  push:
    branches:
      - e5/drift-weak-selection
    paths:
      - ".github/workflows/e5-adjust-resource.yml"

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e5/drift-weak-selection
      - name: Apply frozen bounded discovery adjustment
        run: |
          sed -i 's/E5_RESOURCE_PER_FOUNDER = 160/E5_RESOURCE_PER_FOUNDER = 420/' \
            src/evo_engine/experiments/e5_drift.py
          grep -q '^E5_RESOURCE_PER_FOUNDER = 420$' \
            src/evo_engine/experiments/e5_drift.py
      - name: Commit bounded adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evo_engine/experiments/e5_drift.py
          git commit -m "E5: use nondegenerate scarce-resource scaling"
          git push origin HEAD:e5/drift-weak-selection
