name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      check:
        description: "Quality check to run"
        required: true
        default: "All"
        type: choice
        options:
          - "All"
          - "Ruff"
          - "Pyright"
          - "Import Linter"
          - "Kernel Contracts"
          - "Complexipy"
          - "Tests + coverage"
          - "Reference performance"
          - "MkDocs"
      target_ref:
        description: "Optional branch, tag, or commit SHA to analyze"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.target_ref || github.ref }}-${{ inputs.check || 'All' }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Ruff' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - run: ./scripts/lint

  pyright:
    name: Pyright
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Pyright' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - run: ./scripts/typecheck

  architecture:
    name: Import Linter
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Import Linter' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Import Linter
        shell: bash
        run: |
          set +e
          ./scripts/architecture
          status=$?
          if [[ $status -eq 3 ]]; then
            echo "Import Linter skipped because no architecture contracts are configured."
            exit 0
          fi
          exit "$status"

  kernel_contracts:
    name: Kernel Contracts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Kernel Contracts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - run: ./scripts/kernel_contracts

  complexipy:
    name: Complexipy
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Complexipy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - run: ./scripts/complexity

  coverage:
    name: pytest + coverage
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Tests + coverage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: pytest + coverage
        env:
          COVERAGE_FAIL_UNDER: "90"
        run: ./scripts/coverage

  performance:
    name: Reference performance
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Reference performance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
        with:
          performance: "true"
      - name: Reference + kernel + world-presentation performance profiles
        run: |
          venv/bin/python scripts/profile_kernel.py \
            --scenario all \
            --repeats 3 \
            --warmups 1 \
            --top 25 \
            --output-dir outputs/performance
          venv/bin/python scripts/profile_reference.py \
            --scenario all \
            --repeats 2 \
            --warmups 0 \
            --top 15 \
            --output-dir outputs/performance
          venv/bin/python scripts/profile_world_presentation.py \
            --repeats 3 \
            --output outputs/performance/world-presentation-benchmark.json
          venv/bin/python scripts/benchmark_state_copy.py \
            --fast \
            -o outputs/performance/state-copy-pyperf.json
          venv/bin/python scripts/benchmark_state_copy.py \
            --fast \
            --tracemalloc \
            -o outputs/performance/state-copy-tracemalloc.json
      - name: Upload reference performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-performance-${{ github.run_id }}
          path: outputs/performance/
          retention-days: 14
          if-no-files-found: error

  docs:
    name: MkDocs
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'MkDocs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
        with:
          docs: "true"
      - run: ./scripts/docs

  quality:
    name: Ruff, Pyright, Architecture, Complexity, Tests, Docs
    if: ${{ always() }}
    needs:
      - ruff
      - pyright
      - architecture
      - kernel_contracts
      - complexipy
      - coverage
      - performance
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Quality gate summary
        shell: bash
        run: |
          selected="${{ github.event_name == 'workflow_dispatch' && inputs.check || 'All' }}"

          echo "Selected check: $selected"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target_ref }}" ]]; then
            echo "Target ref:     ${{ inputs.target_ref }}"
          fi
          echo

          failed=0

          evaluate() {
            local label="$1"
            local key="$2"
            local outcome="$3"

            if [[ "$selected" != "All" && "$selected" != "$key" ]]; then
              printf '  %-22s SKIPPED (not selected)\n' "$label:"
              return
            fi

            printf '  %-22s %s\n' "$label:" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          }

          echo "Quality check outcomes:"
          evaluate "Ruff" "Ruff" "${{ needs.ruff.result }}"
          evaluate "Pyright" "Pyright" "${{ needs.pyright.result }}"
          evaluate "Import Linter" "Import Linter" "${{ needs.architecture.result }}"
          evaluate "Kernel Contracts" "Kernel Contracts" "${{ needs.kernel_contracts.result }}"
          evaluate "Complexipy" "Complexipy" "${{ needs.complexipy.result }}"
          evaluate "pytest + coverage" "Tests + coverage" "${{ needs.coverage.result }}"
          evaluate "Reference performance" "Reference performance" "${{ needs.performance.result }}"
          evaluate "MkDocs" "MkDocs" "${{ needs.docs.result }}"

          if [[ $failed -ne 0 ]]; then
            echo "One or more selected quality checks failed."
            exit 1
          fi

          echo "All selected quality checks passed."
