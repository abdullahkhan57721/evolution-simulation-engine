name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      check:
        description: "Quality check to run"
        required: true
        default: "All"
        type: choice
        options:
          - "All"
          - "Ruff"
          - "Pyright"
          - "Import Linter"
          - "Complexipy"
          - "Tests + coverage"
          - "Reference performance"
          - "MkDocs"
      target_ref:
        description: "Optional branch, tag, or commit SHA to analyze"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ inputs.target_ref || github.ref }}-${{ inputs.check || 'All' }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff, Pyright, Architecture, Complexity, Tests, Performance, Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out requested ref
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}

      - name: Check out event ref
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target_ref == '' }}
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install project and quality tools
        run: |
          venv/bin/python -m pip install --upgrade pip
          venv/bin/python -m pip install -e ".[dev,docs]"

      - name: Ruff
        id: ruff
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Ruff' }}
        run: ./scripts/lint

      - name: Pyright
        id: pyright
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Pyright' }}
        run: ./scripts/typecheck

      - name: Import Linter
        id: architecture
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Import Linter' }}
        shell: bash
        run: |
          set +e
          ./scripts/architecture
          status=$?
          if [[ $status -eq 3 ]]; then
            echo "Import Linter skipped because no architecture contracts are configured."
            exit 0
          fi
          exit "$status"

      - name: Complexipy
        id: complexipy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Complexipy' }}
        run: ./scripts/complexity

      - name: pytest + coverage
        id: coverage
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Tests + coverage' }}
        env:
          COVERAGE_FAIL_UNDER: "90"
        run: ./scripts/coverage

      - name: Reference performance profile
        id: performance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'Reference performance' }}
        run: >-
          venv/bin/python scripts/profile_reference.py
          --scenario all
          --repeats 2
          --warmups 0
          --top 15
          --output-dir outputs/performance

      - name: MkDocs strict build
        id: docs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.check == 'All' || inputs.check == 'MkDocs' }}
        run: ./scripts/docs

      - name: Quality gate summary
        if: always()
        shell: bash
        run: |
          selected="${{ github.event_name == 'workflow_dispatch' && inputs.check || 'All' }}"

          echo "Selected check: $selected"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.target_ref }}" ]]; then
            echo "Target ref:     ${{ inputs.target_ref }}"
          fi
          echo

          failed=0

          evaluate() {
            local label="$1"
            local key="$2"
            local outcome="$3"

            if [[ "$selected" != "All" && "$selected" != "$key" ]]; then
              printf '  %-22s SKIPPED (not selected)\n' "$label:"
              return
            fi

            printf '  %-22s %s\n' "$label:" "$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          }

          echo "Quality check outcomes:"
          evaluate "Ruff" "Ruff" "${{ steps.ruff.outcome }}"
          evaluate "Pyright" "Pyright" "${{ steps.pyright.outcome }}"
          evaluate "Import Linter" "Import Linter" "${{ steps.architecture.outcome }}"
          evaluate "Complexipy" "Complexipy" "${{ steps.complexipy.outcome }}"
          evaluate "pytest + coverage" "Tests + coverage" "${{ steps.coverage.outcome }}"
          evaluate "Reference performance" "Reference performance" "${{ steps.performance.outcome }}"
          evaluate "MkDocs" "MkDocs" "${{ steps.docs.outcome }}"

          if [[ $failed -ne 0 ]]; then
            echo "One or more selected quality checks failed."
            exit 1
          fi

          echo "All selected quality checks passed."
