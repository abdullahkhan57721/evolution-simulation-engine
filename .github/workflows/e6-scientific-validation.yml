name: E6 Scientific Validation

on:
  pull_request:
    paths:
      - "src/evo_engine/experiments/e6_invasion.py"
      - "src/evo_engine/experiments/__init__.py"
      - "scripts/e6_invasion.py"
      - "tests/experiments/test_e6_invasion.py"
      - "tests/experiments/test_e6_invasion_contracts.py"
      - "docs/e6_rare_lineage_invasion.md"
      - "docs/development/current_state.md"
      - "docs/development/roadmap.md"
      - "mkdocs.yml"
      - ".github/workflows/e6-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-e6:
    name: Independent E6 confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Generate mechanical Ruff cleanup copies
        run: |
          venv/bin/ruff check --fix --unsafe-fixes src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py || true
          venv/bin/ruff format src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py
      - name: Upload mechanical cleanup copies
        uses: actions/upload-artifact@v4
        with:
          name: e6-ruff-cleanup-${{ github.run_id }}
          path: |
            src/evo_engine/experiments/e6_invasion.py
            tests/experiments/test_e6_invasion.py
          retention-days: 1
      - name: Run frozen disjoint-seed reciprocal invasion matrix
        run: |
          venv/bin/python scripts/e6_invasion.py \
            --mode confirmation \
            --output outputs/e6-validation/e6-confirmation.json
      - name: Upload E6 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6-confirmation-${{ github.run_id }}
          path: outputs/e6-validation/e6-confirmation.json
          retention-days: 30
          if-no-files-found: warn
