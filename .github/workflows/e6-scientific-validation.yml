name: E6 Scientific Validation

on:
  pull_request:
    paths:
      - "src/evo_engine/experiments/e6_invasion.py"
      - "src/evo_engine/experiments/__init__.py"
      - "scripts/e6_invasion.py"
      - "tests/experiments/test_e6_invasion.py"
      - "tests/experiments/test_e6_invasion_contracts.py"
      - "docs/e6_rare_lineage_invasion.md"
      - "docs/development/current_state.md"
      - "docs/development/roadmap.md"
      - "mkdocs.yml"
      - ".github/workflows/e6-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  confirmation-e6:
    name: Independent E6 confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-quality
      - name: Apply deterministic mechanical Ruff cleanup
        run: |
          venv/bin/python - <<'PY'
          from pathlib import Path

          path = Path("src/evo_engine/experiments/e6_invasion.py")
          source = path.read_text(encoding="utf-8")
          old = '''    predicate: Callable[[float], bool]\n    if direction == "increase":\n        predicate = lambda value: value > 0.0\n    elif direction == "decrease":\n        predicate = lambda value: value < 0.0\n    else:\n        predicate = lambda value: value == 0.0\n    return sum(1 for value in values if predicate(value)) / len(values)\n'''
          new = '''    if direction == "increase":\n        matching_count = sum(value > 0.0 for value in values)\n    elif direction == "decrease":\n        matching_count = sum(value < 0.0 for value in values)\n    else:\n        matching_count = sum(value == 0.0 for value in values)\n    return matching_count / len(values)\n'''
          if old in source:
              path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          venv/bin/ruff format src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py
          venv/bin/ruff check src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py
      - name: Commit mechanical cleanup if needed
        run: |
          if git diff --quiet -- src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evo_engine/experiments/e6_invasion.py tests/experiments/test_e6_invasion.py
          git commit -m "Format E6 invasion implementation"
          git push origin HEAD:e6/rare-lineage-invasion
      - name: Run frozen disjoint-seed reciprocal invasion matrix
        run: |
          venv/bin/python scripts/e6_invasion.py \
            --mode confirmation \
            --output outputs/e6-validation/e6-confirmation.json
      - name: Upload E6 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6-confirmation-${{ github.run_id }}
          path: outputs/e6-validation/e6-confirmation.json
          retention-days: 30
          if-no-files-found: warn
