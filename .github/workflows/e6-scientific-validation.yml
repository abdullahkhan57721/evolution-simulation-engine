name: E6 Scientific Validation

on:
  pull_request:
    paths:
      - "src/evo_engine/experiments/e6_invasion.py"
      - "src/evo_engine/experiments/__init__.py"
      - "scripts/e6_invasion.py"
      - "tests/experiments/test_e6_invasion.py"
      - "tests/experiments/test_e6_invasion_contracts.py"
      - "docs/e6_rare_lineage_invasion.md"
      - "docs/development/current_state.md"
      - "docs/development/roadmap.md"
      - "mkdocs.yml"
      - ".github/workflows/e6-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-e6:
    name: Bounded E6 discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run declared discovery-only reciprocal invasion matrix
        run: |
          venv/bin/python scripts/e6_invasion.py \
            --mode discovery \
            --output outputs/e6-validation/e6-discovery.json
      - name: Upload E6 discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e6-discovery-${{ github.run_id }}
          path: outputs/e6-validation/e6-discovery.json
          retention-days: 30
          if-no-files-found: warn
