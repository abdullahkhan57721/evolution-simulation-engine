name: E6 Documentation Finalizer

on:
  pull_request:
    paths:
      - "scripts/_e6_finalize_docs.py"
      - "docs/e6_rare_lineage_invasion.md"
      - "docs/development/current_state.md"
      - "docs/development/roadmap.md"
      - "mkdocs.yml"
      - ".github/workflows/e6-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-e6-docs:
    name: Finalize E6 project orientation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Fetch authoritative main
        run: git fetch origin main --depth=1
      - name: Patch latest orientation and E7 handoff
        run: python scripts/_e6_finalize_docs.py
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit final E6 handoff documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/e6_rare_lineage_invasion.md docs/development/current_state.md docs/development/roadmap.md mkdocs.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Document final E6 to E7 handoff"
          git push origin HEAD:e6/rare-lineage-invasion
