name: Q2 targeted Ruff fix helper

on:
  push:
    branches:
      - q2/native-authoring
    paths:
      - .github/workflows/q2-ruff-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: q2/native-authoring
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply only mechanical Ruff fixes
        run: |
          python -m pip install 'ruff>=0.9'
          files=(
            src/evo_engine/desktop/controllers/evidence.py
            src/evo_engine/desktop/controllers/experiment.py
            src/evo_engine/desktop/controllers/reference.py
            src/evo_engine/desktop/controllers/simulation.py
            src/evo_engine/workbench/simulation_authoring.py
            src/evo_engine/workbench/evidence_authoring.py
            src/evo_engine/workbench/experiment_authoring.py
            src/evo_engine/ui/simulation_authoring.py
            src/evo_engine/ui/evidence_authoring.py
            src/evo_engine/ui/experiment_authoring.py
            tests/architecture/test_q2_native_authoring_surface.py
            tests/architecture/test_desktop_dependency_boundary.py
          )
          ruff check --fix "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/q2-ruff-fix.yml
          git add "${files[@]}"
          git commit -m "Q2: apply targeted Ruff fixes"
          git push origin HEAD:q2/native-authoring
