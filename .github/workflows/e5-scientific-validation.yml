name: E5 Scientific Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "src/evo_engine/**"
      - "!src/evo_engine/ui/**"
      - "!src/evo_engine/workbench/**"
      - "!src/evo_engine/desktop/**"
      - "!src/evo_engine/presentation/**"
      - "!src/evo_engine/cinematic/**"
      - "scripts/e5_drift.py"
      - ".github/workflows/e5-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-e5:
    name: Independent E5 confirmation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen disjoint-seed confirmation matrix
        run: |
          venv/bin/python scripts/e5_drift.py \
            --mode confirmation \
            --weak-pair 3-4 \
            --output outputs/e5-validation/e5-confirmation.json
      - name: Upload E5 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-confirmation-${{ github.run_id }}
          path: outputs/e5-validation/e5-confirmation.json
          retention-days: 30
          if-no-files-found: warn
