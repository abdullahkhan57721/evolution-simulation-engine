name: E5 Scientific Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pyproject.toml"
      - "src/evo_engine/access/**"
      - "src/evo_engine/admission/**"
      - "src/evo_engine/behavior/**"
      - "src/evo_engine/biology/**"
      - "src/evo_engine/characteristics/**"
      - "src/evo_engine/departure/**"
      - "src/evo_engine/energetics/**"
      - "src/evo_engine/engine/**"
      - "src/evo_engine/evolution/**"
      - "src/evo_engine/feeding/**"
      - "src/evo_engine/genetics/**"
      - "src/evo_engine/observation/**"
      - "src/evo_engine/presets/controlled_locomotion/**"
      - "src/evo_engine/processes/**"
      - "src/evo_engine/production/**"
      - "src/evo_engine/propagation/**"
      - "src/evo_engine/reference/**"
      - "src/evo_engine/reproduction/**"
      - "src/evo_engine/resolvers/**"
      - "src/evo_engine/spatial/**"
      - "src/evo_engine/telemetry/**"
      - "src/evo_engine/validation/**"
      - "src/evo_engine/world/**"
      - "src/evo_engine/experiments/__init__.py"
      - "src/evo_engine/experiments/science.py"
      - "src/evo_engine/experiments/e3_performance.py"
      - "src/evo_engine/experiments/e5_drift.py"
      - "scripts/e5_drift.py"
      - "tests/experiments/test_e5_drift.py"
      - ".github/actions/setup-quality/action.yml"
      - ".github/workflows/e5-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-scientific-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirmation-e5:
    name: Independent E5 confirmation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen disjoint-seed confirmation matrix
        run: |
          venv/bin/python scripts/e5_drift.py \
            --mode confirmation \
            --weak-pair 3-4 \
            --output outputs/e5-validation/e5-confirmation.json
      - name: Upload E5 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e5-confirmation-${{ github.run_id }}
          path: outputs/e5-validation/e5-confirmation.json
          retention-days: 30
          if-no-files-found: warn
