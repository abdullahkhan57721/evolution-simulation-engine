name: E3 Scientific Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pyproject.toml"
      - "src/evo_engine/access/**"
      - "src/evo_engine/admission/**"
      - "src/evo_engine/behavior/**"
      - "src/evo_engine/biology/**"
      - "src/evo_engine/characteristics/**"
      - "src/evo_engine/departure/**"
      - "src/evo_engine/energetics/**"
      - "src/evo_engine/engine/**"
      - "src/evo_engine/evolution/**"
      - "src/evo_engine/feeding/**"
      - "src/evo_engine/genetics/**"
      - "src/evo_engine/observation/**"
      - "src/evo_engine/presets/controlled_locomotion/**"
      - "src/evo_engine/processes/**"
      - "src/evo_engine/production/**"
      - "src/evo_engine/propagation/**"
      - "src/evo_engine/reference/**"
      - "src/evo_engine/reproduction/**"
      - "src/evo_engine/resolvers/**"
      - "src/evo_engine/spatial/**"
      - "src/evo_engine/telemetry/**"
      - "src/evo_engine/validation/**"
      - "src/evo_engine/world/**"
      - "src/evo_engine/experiments/__init__.py"
      - "src/evo_engine/experiments/locomotion.py"
      - "src/evo_engine/experiments/science.py"
      - "src/evo_engine/experiments/e3_performance.py"
      - "scripts/e3_landscape.py"
      - "tests/experiments/test_e3_performance.py"
      - ".github/actions/setup-quality/action.yml"
      - ".github/workflows/e3-scientific-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e3-scientific-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm-e3:
    name: Independent E3 confirmation
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run frozen unseen-seed confirmation matrix
        run: |
          venv/bin/python scripts/e3_landscape.py \
            --mode confirmation \
            --output outputs/e3-validation/e3-confirmation.json
      - name: Upload E3 confirmation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-confirmation-${{ github.run_id }}
          path: outputs/e3-validation/e3-confirmation.json
          retention-days: 30
          if-no-files-found: warn

  sensitivity-e3:
    name: E3 zero-cost mechanism sensitivity
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-quality
      - name: Run bounded locomotion-cost sensitivity
        run: |
          venv/bin/python scripts/e3_landscape.py \
            --mode sensitivity \
            --output outputs/e3-validation/e3-sensitivity.json
      - name: Upload E3 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3-sensitivity-${{ github.run_id }}
          path: outputs/e3-validation/e3-sensitivity.json
          retention-days: 30
          if-no-files-found: warn
