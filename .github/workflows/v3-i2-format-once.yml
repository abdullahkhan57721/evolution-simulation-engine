name: V3 I2 Format Once

on:
  push:
    branches:
      - v3/i2-b3-flagship-director
    paths:
      - .github/workflows/v3-i2-format-once.yml

permissions:
  contents: write

jobs:
  format-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: v3/i2-b3-flagship-director
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Format B3 renderer fix and remove temporary workflow
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format src/evo_engine/cinematic/_b3_manim.py
          git rm .github/workflows/v3-i2-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/evo_engine/cinematic/_b3_manim.py
          git commit -m 'Format B3 Manim compatibility fix'
          git push origin HEAD:v3/i2-b3-flagship-director
