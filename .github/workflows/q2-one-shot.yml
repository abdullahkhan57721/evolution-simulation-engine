name: Q2 One Shot

on:
  push:
    branches:
      - q2/native-authoring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: q2/native-authoring
      - name: Remove duplicate QML controller aliases
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/evo_engine/desktop/qml/Main.qml")
          text = path.read_text()
          block = "    readonly property var simulation: applicationController.simulationController\n    readonly property var evidence: applicationController.evidenceController\n    readonly property var experiment: applicationController.experimentController\n"
          doubled = block + block
          if doubled not in text:
              raise SystemExit("duplicate alias block not found")
          path.write_text(text.replace(doubled, block, 1))
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evo_engine/desktop/qml/Main.qml
          git rm .github/workflows/q2-one-shot.yml
          git commit -m "Fix Q2 QML controller wiring"
          git push origin HEAD:q2/native-authoring
