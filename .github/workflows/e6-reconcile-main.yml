name: E6 Reconcile Latest Main

on:
  push:
    branches:
      - e6/rare-lineage-invasion
    paths:
      - ".github/workflows/e6-reconcile-main.yml"
      - "scripts/e6_reconcile_main.py"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: e6/rare-lineage-invasion
      - name: Reconcile latest main
        env:
          BRANCH: e6/rare-lineage-invasion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if ! git merge-base --is-ancestor origin/main HEAD; then
            set +e
            git merge --no-commit --no-ff origin/main
            set -e

            unexpected="$(git diff --name-only --diff-filter=U | grep -Ev '^(docs/development/current_state.md|docs/development/roadmap.md)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

          git checkout origin/main -- docs/development/current_state.md docs/development/roadmap.md
          git add docs/development/current_state.md docs/development/roadmap.md
          python scripts/e6_reconcile_main.py
          git add docs/development/current_state.md docs/development/roadmap.md
          git rm .github/workflows/e6-reconcile-main.yml scripts/e6_reconcile_main.py

          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git status --short
          git commit -m "Merge latest main into E6 and reconcile orientation"
          git push origin HEAD:"$BRANCH"
